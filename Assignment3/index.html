<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Calculator (JavaScript)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="calculator" aria-label="Calculator">
        <header class="calculator__header">
          <h1 class="calculator__title">Calculator</h1>
        </header>

        <div class="display" role="group" aria-label="Calculator display">
          <div class="display__meta">
            <span id="memory" class="display__memory" aria-label="Pending operation"></span>
          </div>
          <input
            id="display"
            class="display__input"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            spellcheck="false"
            aria-label="Input and output"
            readonly
            value=""
          />
        </div>

        <div class="keys" role="group" aria-label="Calculator keys">
          <button class="key key--muted" type="button" data-action="clear">C</button>
          <button class="key key--muted" type="button" data-action="back">⌫</button>
          <button class="key key--muted" type="button" data-action="square">x²</button>
          <button class="key key--op" type="button" data-op="/">÷</button>

          <button class="key" type="button" data-digit="7">7</button>
          <button class="key" type="button" data-digit="8">8</button>
          <button class="key" type="button" data-digit="9">9</button>
          <button class="key key--op" type="button" data-op="*">×</button>

          <button class="key" type="button" data-digit="4">4</button>
          <button class="key" type="button" data-digit="5">5</button>
          <button class="key" type="button" data-digit="6">6</button>
          <button class="key key--op" type="button" data-op="-">−</button>

          <button class="key" type="button" data-digit="1">1</button>
          <button class="key" type="button" data-digit="2">2</button>
          <button class="key" type="button" data-digit="3">3</button>
          <button class="key key--op" type="button" data-op="+">+</button>

          <button class="key key--wide" type="button" data-digit="0">0</button>
          <button class="key" type="button" data-action="dot">.</button>
          <button class="key key--equals" type="button" data-action="equals">=</button>
        </div>

      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
